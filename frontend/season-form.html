<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Form</title>
    <style>
    .form-container { max-width:600px; margin:0 auto; background:#f9f9f9; padding:30px; border-radius:8px; }
    .form-container label { display:block; margin-bottom:8px; font-weight:bold; }
    .form-container input, .form-container select { width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
    .btn-save { background:#007cba; color:white; border:none; padding:10px 30px; border-radius:4px; cursor:pointer; }
    .btn-save:hover { background:#005a87; }
    .btn-back { display:inline-block; padding:10px 20px; background:#ccc; color:#333; border-radius:4px; text-decoration:none; }
    .btn-back:hover { background:#bbb; }
    .mock-note { color:#999; font-style:italic; text-align:center; margin-top:30px; }
    .text-center { text-align:center; }
    h1 { text-align:center; }
</style>

<h1 id="form-title">Add Season</h1>

<div class="form-container">
    <form id="season-form">
        <label for="season-year">Season Year</label>
        <input type="number" id="season-year" min="1900" max="2200" placeholder="e.g. 2027" required>

        <label>Status</label>
        <select id="status">
            <option value="active">Active</option>
            <option value="archived">Archived</option>
        </select>

        <div class="text-center" style="margin-top:20px;">
            <button type="submit" class="btn-save" id="save-btn">💾 Save Changes</button>
        </div>
    </form>
</div>


<script>
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const seasonId = urlParams.get('id');
    const seasonForm = document.getElementById('season-form');
    const saveButton = document.getElementById('save-btn');

    if (action === 'edit') {
        document.getElementById('form-title').textContent = '📝 Edit Season';
        fetch((window.competitionAdmin && window.competitionAdmin.restUrl
            ? window.competitionAdmin.restUrl
            : '/wp-json/competition/v1') + '/seasons?status=all')
            .then(function(response) { return response.json(); })
            .then(function(payload) {
                const season = (payload.data || []).find(function(item) { return String(item.id) === String(seasonId); });
                if (!season) throw new Error('Season could not be found.');
                document.getElementById('season-year').value = season.year;
                document.getElementById('status').value = season.status === 'active' ? 'active' : 'archived';
            })
            .catch(function(error) { alert(error.message); });
    } else {
        document.getElementById('form-title').textContent = '📝 Add Season';
    }

    seasonForm.addEventListener('submit', function(event) {
        event.preventDefault();
        saveButton.disabled = true;
        saveButton.textContent = 'Saving...';

        const season = {
            year: Number(document.getElementById('season-year').value),
            status: document.getElementById('status').value.toLowerCase()
        };

        if (seasonId) {
            season.id = Number(seasonId);
        }

        const apiBase = window.competitionAdmin && window.competitionAdmin.restUrl
            ? window.competitionAdmin.restUrl
            : '/wp-json/competition/v1';

        fetch(apiBase + '/seasons', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-WP-Nonce': window.competitionAdmin
                    ? window.competitionAdmin.restNonce
                    : ''
            },
            body: JSON.stringify(season)
        })
        .then(function(response) {
            return response.json().then(function(data) {
                if (!response.ok || data.success === false) {
                    throw new Error(data.message || 'Could not save season.');
                }
                return data;
            });
        })
        .then(function() {
            alert('Season saved successfully.');
            window.location.href = 'admin.php?page=competition-results';
        })
        .catch(function(error) {
            alert(error.message);
            saveButton.disabled = false;
            saveButton.textContent = '💾 Save Changes';
        });
    });
</script>
</body>
</html>

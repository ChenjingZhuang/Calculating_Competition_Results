<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cup Form</title>
    <style>
    .form-container { max-width:600px; margin:0 auto; background:#f9f9f9; padding:30px; border-radius:8px; }
    .form-container label { display:block; margin-bottom:8px; font-weight:bold; }
    .form-container input, .form-container select { width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; }
    .btn-save { background:#007cba; color:white; border:none; padding:10px 30px; border-radius:4px; cursor:pointer; }
    .btn-save:hover { background:#005a87; }
    .btn-back { display:inline-block; padding:10px 20px; background:#ccc; color:#333; border-radius:4px; text-decoration:none; }
    .btn-back:hover { background:#bbb; }
    .mock-note { color:#999; font-style:italic; text-align:center; margin-top:30px; }
    .text-center { text-align:center; }
    h1 { text-align:center; }
</style>

<h1 id="form-title">🏆 Add Cup</h1>

<div class="form-container">
    <form id="cup-form">
        <label>Cup Name</label>
        <input type="text" id="cup-name" placeholder="e.g. XCO Cup 2027">

        <label>Season</label>
        <select id="season">
            <option>2026 XCO Cup</option>
            <option>2025 XCO Cup</option>
            <option>2024 XCO Cup</option>
        </select>

        <label>Category / Series</label>
        <input type="text" id="category" placeholder="e.g. M Elite, N 19">

        <label>Scoring System</label>
        <select id="scoring">
            <option>Standard (30-25-21-18-16-14-12-10-8-7-6-5-4-3-2-1)</option>
            <option>Custom</option>
        </select>

        <label>Counted Events</label>
        <input type="number" id="counted-events" min="1" value="3">

        <label>Status</label>
        <select id="status">
            <option value="draft">Draft</option>
            <option value="active">Published</option>
        </select>

        <div class="text-center" style="margin-top:20px;">
            <button type="submit" class="btn-save" id="save-btn">💾 Save Changes</button>
        </div>
    </form>
</div>


<script>
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const cupId = urlParams.get('id');
    const apiBase = window.competitionAdmin && window.competitionAdmin.restUrl
        ? window.competitionAdmin.restUrl
        : '/wp-json/competition/v1';
    const seasonSelect = document.getElementById('season');
    const cupForm = document.getElementById('cup-form');
    const saveButton = document.getElementById('save-btn');

    function loadSeasons() {
        return fetch(apiBase + '/seasons?status=all')
            .then(function(response) {
                if (!response.ok) throw new Error('Could not load seasons.');
                return response.json();
            })
            .then(function(payload) {
                const seasons = payload.data || [];
                seasonSelect.innerHTML = seasons.map(function(season) {
                    return '<option value="' + season.id + '">' + season.name + '</option>';
                }).join('');
                if (!seasons.length) throw new Error('Create a season before creating a cup.');
            });
    }

    function loadCup() {
        if (!cupId) return Promise.resolve();
        return fetch(apiBase + '/cups?season_id=' + encodeURIComponent(seasonSelect.value))
            .then(function(response) { return response.json(); })
            .then(function(payload) {
                const cup = (payload.data || []).find(function(item) { return String(item.id) === String(cupId); });
                if (!cup) throw new Error('Cup could not be found.');
                document.getElementById('cup-name').value = cup.name || '';
                document.getElementById('counted-events').value = cup.counted_events_limit || 3;
                document.getElementById('status').value = cup.status || 'draft';
                document.getElementById('form-title').textContent = '🏆 Edit Cup';
            });
    }

    loadSeasons().then(loadCup).catch(function(error) {
        document.getElementById('form-title').textContent = error.message;
        saveButton.disabled = true;
    });

    cupForm.addEventListener('submit', function(event) {
        event.preventDefault();
        saveButton.disabled = true;
        saveButton.textContent = 'Saving...';

        const cup = {
            name: document.getElementById('cup-name').value.trim(),
            season_id: Number(seasonSelect.value),
            category: document.getElementById('category').value.trim(),
            counted_events_limit: Number(document.getElementById('counted-events').value),
            status: document.getElementById('status').value.toLowerCase()
        };
        if (cupId) cup.id = Number(cupId);

        fetch(apiBase + '/cups', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-WP-Nonce': window.competitionAdmin ? window.competitionAdmin.restNonce : ''
            },
            body: JSON.stringify(cup)
        })
            .then(function(response) {
                return response.json().then(function(payload) {
                    if (!response.ok || payload.success === false) throw new Error(payload.message || 'Could not save cup.');
                    return payload;
                });
            })
            .then(function() { window.location.href = 'admin.php?page=competition-results'; })
            .catch(function(error) {
                alert(error.message);
                saveButton.disabled = false;
                saveButton.textContent = '💾 Save Changes';
            });
    });
</script>
</body>
</html>

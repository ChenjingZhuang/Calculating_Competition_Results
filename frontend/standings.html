<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Standings</title>
    <style>
        #wpadminbar { display: none !important; }
        html { margin-top: 0 !important; }
        .entry-title {
            text-align: center !important;
            font-size: 28px;
            margin-bottom: 30px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        .standings-table {
            width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            background: white;
            margin: 0 auto 30px auto;   
            border: 1px solid #ccc;
            table-layout: fixed;        
        }
        .standings-table th,
        .standings-table td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: center;         
            vertical-align: middle;
            word-wrap: break-word;      
        }
        .standings-table th {
            background: #f2f2f2;
            font-weight: bold;
        }
        .standings-table th:nth-child(1) { width: 8%; }   /* Rank */
        .standings-table th:nth-child(2) { width: 15%; }  /* First Name */
        .standings-table th:nth-child(3) { width: 15%; }  /* Last Name */
        .standings-table th:nth-child(4) { width: 25%; }  /* Club */
        .standings-table th:nth-child(5) { width: 8%; }   /* 1/8 */
        .standings-table th:nth-child(6) { width: 8%; }   /* 2/8 */
        .standings-table th:nth-child(7) { width: 8%; }   /* 3/8 */
        .standings-table th:nth-child(8) { width: 13%; }  /* Total */

        h2 {
            text-align: center;
            margin: 25px 0 10px 0;
        }
        
        .mock-note {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1 id="standings-title">Competition Standings</h1>
    <p id="standings-status" class="mock-note">Loading competitions...</p>
    <p class="text-center">
        <label for="cup-select">Cup</label>
        <select id="cup-select"></select>
        <label for="category-input">Category</label>
        <input id="category-input" type="text" placeholder="All categories">
        <button id="load-standings" type="button">Load standings</button>
        <button id="download-standings" type="button">Download CSV</button>
    </p>
    <div id="standings-content"></div>

    <script>
        (function () {
            const apiBase = window.competitionAdmin && window.competitionAdmin.restUrl
                ? window.competitionAdmin.restUrl
                : '/wp-json/competition/v1';
            const requestHeaders = window.competitionAdmin && window.competitionAdmin.restNonce
                ? { 'X-WP-Nonce': window.competitionAdmin.restNonce }
                : {};
            const cupSelect = document.getElementById('cup-select');
            const categoryInput = document.getElementById('category-input');
            const status = document.getElementById('standings-status');
            const content = document.getElementById('standings-content');

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>'"]/g, function (character) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character];
                });
            }

            function renderStandings(payload) {
                const rows = payload.data && Array.isArray(payload.data.standings) ? payload.data.standings : [];
                const cup = payload.data && payload.data.cup ? payload.data.cup : {};
                document.getElementById('standings-title').textContent = cup.name || 'Competition Standings';
                if (!rows.length) {
                    content.innerHTML = '<p class="mock-note">No standings found.</p>';
                    return;
                }
                content.innerHTML = '<table class="standings-table"><thead><tr><th>Rank</th><th>Category</th><th>Athlete</th><th>Club</th><th>1st</th><th>2nd</th><th>3rd</th><th>Total</th></tr></thead><tbody>' +
                    rows.map(function (row) {
                        const counts = row.place_counts || {};
                        return '<tr><td>' + escapeHtml(row.rank) + '</td><td>' + escapeHtml(row.category || '') + '</td><td>' + escapeHtml(row.athlete_name) + '</td><td>' + escapeHtml(row.club || '') + '</td><td>' + escapeHtml(counts[1] || 0) + '</td><td>' + escapeHtml(counts[2] || 0) + '</td><td>' + escapeHtml(counts[3] || 0) + '</td><td>' + escapeHtml(row.total_score) + '</td></tr>';
                    }).join('') + '</tbody></table>';
            }

            function loadStandings() {
                const cupId = cupSelect.value;
                if (!cupId) return;
                status.textContent = 'Loading standings...';
                let url = apiBase + '/standings?cup_id=' + encodeURIComponent(cupId);
                if (categoryInput.value.trim()) url += '&category=' + encodeURIComponent(categoryInput.value.trim());
                fetch(url, { headers: requestHeaders })
                    .then(function (response) { if (!response.ok) throw new Error('Standings request failed.'); return response.json(); })
                    .then(function (payload) { if (payload.success === false) throw new Error(payload.message || 'Standings request failed.'); renderStandings(payload); status.textContent = 'Connected to competition API'; })
                    .catch(function (error) { status.textContent = error.message; content.innerHTML = ''; });
            }

            fetch(apiBase + '/seasons', { headers: requestHeaders })
                .then(function (response) { if (!response.ok) throw new Error('Could not load seasons.'); return response.json(); })
                .then(function (seasonPayload) {
                    const seasons = seasonPayload.data || [];
                    if (!seasons.length) throw new Error('No seasons found.');
                    return Promise.all(seasons.map(function (season) {
                        return fetch(apiBase + '/cups?season_id=' + encodeURIComponent(season.id), { headers: requestHeaders }).then(function (response) { return response.json(); });
                    }));
                })
                .then(function (cupPayloads) {
                    const cups = cupPayloads.reduce(function (all, payload) { return all.concat(payload.data || []); }, []);
                    cupSelect.innerHTML = cups.map(function (cup) { return '<option value="' + escapeHtml(cup.id) + '">' + escapeHtml(cup.name) + '</option>'; }).join('');
                    loadStandings();
                })
                .catch(function (error) { status.textContent = error.message; });

            document.getElementById('load-standings').addEventListener('click', loadStandings);
            document.getElementById('download-standings').addEventListener('click', function () {
                if (!cupSelect.value) return;
                let url = apiBase + '/standings/export?cup_id=' + encodeURIComponent(cupSelect.value);
                if (categoryInput.value.trim()) url += '&category=' + encodeURIComponent(categoryInput.value.trim());
                window.location.href = url;
            });
        }());
    </script>
</body>
</html>
